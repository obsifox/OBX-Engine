name: feature
description: "Implement new feature"
type: workflow
version: 1.2.1

states_required:
  - INTAKE
  - BASELINE
  - CLASSIFICATION
  - PLANNING
  - EXECUTION
  - VALIDATION
  - REVIEW
  - VERIFICATION
  - RELEASE_REVIEW

gates:
  - G0_Build
  - G1_Tests
  - G2_Lens
  - G3_Security

agents_required:
  - architect
  - worker
  - reviewer
  - verifier

agents_optional:
  - security-reviewer
  - release-manager

permissions_default:
  worker: {filesystem: write, shell: execute}

max_rework_cycles: 2

human_approval:
  required_when:
    - adds_dependency
    - arch_change
    - db_schema_change

artifacts_expected:
  - plan.md
  - changed_files
  - current_build.log
  - current_test.log
  - review_files
  - verification_log
  - receipt.json
