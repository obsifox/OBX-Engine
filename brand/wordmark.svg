  <text x="420" y="180" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="128" letter-spacing="10"><tspan fill="#E8ECF2">OB</tspan><tspan fill="url(#fox)">X</tspan></text>
  <text x="424" y="270" font-family="Arial, sans-serif" font-weight="700" font-size="52" letter-spacing="34" fill="#8A94A6">E N G I N E</text>
