name: database
type: domain_overlay
description: "Database layer"
detection:
  files: ["migrations/", "schema.sql", "prisma/schema.prisma", "drizzle/"]
overlays:
  lenses: [security, testing, performance, architecture]
  checks: [sql_injection, n_plus_one, indexing, migration_rollback, pii_encryption]
  playbook_base: references/playbooks/web-api-backend.md
risk_modifiers:
  security: high
  data: high
